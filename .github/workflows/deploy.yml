name: Déployer Behanian

on:
  push:
    branches: [main]

jobs:
  deploy-vps:
    name: Déployer sur VPS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Copier code vers VPS (tar+scp)
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts 2>/dev/null
          tar -czf /tmp/behanian_vps.tar.gz \
            --exclude='.git' \
            --exclude='venv' \
            --exclude='__pycache__' \
            --exclude='*.pyc' \
            --exclude='staticfiles' \
            --exclude='media' \
            --exclude='*.sqlite3' \
            --exclude='.env' \
            .
          echo "Archive : $(du -sh /tmp/behanian_vps.tar.gz | cut -f1)"
          scp -i ~/.ssh/vps_key -o StrictHostKeyChecking=no \
            /tmp/behanian_vps.tar.gz \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/tmp/behanian_vps.tar.gz
          echo "SCP vers VPS OK"

      - name: Appliquer code et migrations sur VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 8m
          script: |
            set -e
            echo "=== Extraction ==="
            tar -xzf /tmp/behanian_vps.tar.gz -C /opt/behanian/ --overwrite
            rm -f /tmp/behanian_vps.tar.gz
            echo "Extraction OK"
            cd /opt/behanian
            source venv/bin/activate
            echo "=== Dépendances ==="
            pip install -r requirements.txt --quiet
            echo "=== Migrations ==="
            python manage.py migrate --noinput
            echo "=== Statiques ==="
            python manage.py collectstatic --noinput
            echo "=== Init catalogues ==="
            python manage.py init_plats_simples
            python manage.py init_boissons_bar
            python manage.py init_plats_gibier
            echo "=== Redémarrage ==="
            sudo systemctl restart gunicorn
            chmod +x /opt/behanian/sync_complexe.sh
            mkdir -p ~/.ssh && chmod 700 ~/.ssh
            touch ~/.ssh/authorized_keys && chmod 600 ~/.ssh/authorized_keys
            grep -qF "AAAAC3NzaC1lZDI1NTE5AAAAICrq1NCIcbQUhoQ7ib3npl0mvNRrFt8A9+r9TsTelcd4" ~/.ssh/authorized_keys || echo "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAICrq1NCIcbQUhoQ7ib3npl0mvNRrFt8A9+r9TsTelcd4 behanian@behanian-server" >> ~/.ssh/authorized_keys
            echo "VPS_OK"

  deploy-local:
    name: Déployer sur serveur local
    runs-on: ubuntu-latest
    needs: deploy-vps
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Test connectivité complexe
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 5m
          script: |
            # ── 1. S'assurer que WireGuard est actif ────────────────────────
            sudo systemctl enable wg-quick@wg0 --quiet 2>/dev/null || true
            WG_STATE=$(sudo systemctl is-active wg-quick@wg0 2>/dev/null || echo "inactive")
            echo "WireGuard état: $WG_STATE"
            if [ "$WG_STATE" != "active" ]; then
              echo "Interface wg0 inactive — démarrage..."
              sudo systemctl start wg-quick@wg0 || true
              sleep 5
            fi

            # ── 3. Afficher l'état de l'interface pour diagnostic ───────────
            echo "=== wg show ==="
            sudo wg show wg0 2>/dev/null || echo "(wg show indisponible)"
            echo "=== route vers 10.8.0.2 ==="
            ip route get 10.8.0.2 2>/dev/null || echo "(route indisponible)"

            # ── 4. Ping avec 3 tentatives, restart WG entre chaque si besoin ─
            WG_OK=0
            for attempt in 1 2 3; do
              if ping -c 3 -W 5 10.8.0.2 > /dev/null 2>&1; then
                echo "Ping 10.8.0.2 OK (tentative $attempt)"
                WG_OK=1
                break
              fi
              echo "Ping échoué (tentative $attempt/3) — restart wg-quick@wg0..."
              sudo systemctl restart wg-quick@wg0
              sleep 10
            done
            if [ "$WG_OK" -eq 0 ]; then
              echo "ERREUR: 10.8.0.2 injoignable après 3 tentatives"
              sudo systemctl status wg-quick@wg0 --no-pager || true
              exit 1
            fi

            # ── 5. Vérifier SSH avec 3 tentatives ───────────────────────────
            SSH_OK=0
            for attempt in 1 2 3; do
              if ssh -o StrictHostKeyChecking=no -o ConnectTimeout=15 -o BatchMode=yes \
                   behanian@10.8.0.2 "echo SSH_OK" 2>/dev/null; then
                echo "SSH complexe OK (tentative $attempt)"
                SSH_OK=1
                break
              fi
              echo "SSH échoué (tentative $attempt/3) — attente 10s..."
              sleep 10
            done
            if [ "$SSH_OK" -eq 0 ]; then
              echo "ERREUR: SSH vers complexe injoignable après 3 tentatives"
              exit 1
            fi
            echo "Connectivité complexe validée"

      - name: Copier code vers complexe (tar+scp)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 8m
          script: |
            set -e
            echo "=== Création archive depuis VPS ==="
            tar -czf /tmp/behanian_code.tar.gz \
              --exclude='.git' \
              --exclude='venv' \
              --exclude='__pycache__' \
              --exclude='*.pyc' \
              --exclude='staticfiles' \
              --exclude='media' \
              --exclude='*.sqlite3' \
              --exclude='.env' \
              -C /opt/behanian .
            echo "Archive : $(du -sh /tmp/behanian_code.tar.gz | cut -f1)"
            echo "=== Envoi vers complexe ==="
            scp -o StrictHostKeyChecking=no /tmp/behanian_code.tar.gz behanian@10.8.0.2:/tmp/behanian_code.tar.gz
            echo "Envoi OK"
            rm -f /tmp/behanian_code.tar.gz

      - name: Appliquer code et migrations sur complexe
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 10m
          script: |
            ssh -o StrictHostKeyChecking=no -o ConnectTimeout=30 behanian@10.8.0.2 bash << 'REMOTE'
              set -e
              echo "--- STEP 1: extraction ---"
              tar -xzf /tmp/behanian_code.tar.gz -C /opt/behanian/ --overwrite
              rm -f /tmp/behanian_code.tar.gz
              echo "--- STEP 2: venv ---"
              cd /opt/behanian
              source venv/bin/activate
              echo "--- STEP 3: pip ---"
              pip install -r requirements.txt --quiet
              echo "--- STEP 4: migrate ---"
              python manage.py migrate --noinput
              echo "--- STEP 5: collectstatic ---"
              python manage.py collectstatic --noinput
              echo "--- STEP 6: init catalogues ---"
              python manage.py init_boissons_bar
              python manage.py init_plats_simples
              python manage.py init_plats_gibier
              echo "--- STEP 7: config système (best-effort, sudo limité ok) ---"
              sudo cp /opt/behanian/deploy/gunicorn-complexe.service /etc/systemd/system/gunicorn.service 2>/dev/null || echo "WARN: gunicorn.service non copié"
              sudo cp /opt/behanian/deploy/99-behanian.conf /etc/sysctl.d/99-behanian.conf 2>/dev/null || echo "WARN: sysctl non copié"
              sudo sysctl -p /etc/sysctl.d/99-behanian.conf --quiet 2>/dev/null || true
              sudo cp /opt/behanian/deploy/behanian-watchdog.service /etc/systemd/system/behanian-watchdog.service 2>/dev/null || echo "WARN: watchdog.service non copié"
              sudo cp /opt/behanian/deploy/behanian-watchdog.timer   /etc/systemd/system/behanian-watchdog.timer   2>/dev/null || echo "WARN: watchdog.timer non copié"
              sudo cp /opt/behanian/deploy/behanian-watchdog.sh      /usr/local/bin/behanian-watchdog              2>/dev/null || echo "WARN: watchdog.sh non copié"
              sudo chmod +x /usr/local/bin/behanian-watchdog 2>/dev/null || true
              sudo systemctl daemon-reload 2>/dev/null || true
              sudo systemctl enable --now behanian-watchdog.timer 2>/dev/null || true
              echo "--- STEP 8: restart gunicorn ---"
              sudo systemctl restart gunicorn
              echo "COMPLEXE_OK"
            REMOTE

      - name: Diagnostic système complexe
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 3m
          script: |
            ssh -o StrictHostKeyChecking=no -o ConnectTimeout=20 behanian@10.8.0.2 bash << 'DIAG'
              echo "════════════════════════════════════════"
              echo "  DIAGNOSTIC SYSTÈME COMPLEXE"
              echo "════════════════════════════════════════"

              echo ""
              echo "── Mémoire RAM ──────────────────────────"
              free -h

              echo ""
              echo "── Espace disque ────────────────────────"
              df -h / /opt 2>/dev/null | head -5

              echo ""
              echo "── Uptime & charge ──────────────────────"
              uptime

              echo ""
              echo "── Derniers redémarrages ────────────────"
              last reboot | head -8 2>/dev/null || echo "(last non disponible)"

              echo ""
              echo "── Tués par OOM (7 derniers jours) ──────"
              sudo journalctl -k --since "7 days ago" 2>/dev/null \
                | grep -i "killed process\|out of memory\|oom.kill" \
                | tail -10 \
                || echo "(aucun OOM détecté ou journalctl indisponible)"

              echo ""
              echo "── Erreurs critiques système (48h) ──────"
              sudo journalctl -p err..emerg --since "48 hours ago" --no-pager 2>/dev/null \
                | grep -v "^--" | tail -15 \
                || echo "(journalctl indisponible)"

              echo ""
              echo "── État gunicorn ────────────────────────"
              sudo systemctl status gunicorn --no-pager -l 2>/dev/null | head -20 || echo "(gunicorn status indisponible)"

              echo ""
              echo "── Processus top RAM ────────────────────"
              ps aux --sort=-%mem 2>/dev/null | head -8 || echo "(ps indisponible)"

              echo ""
              echo "── Watchdog timer (actif ?) ─────────────"
              systemctl list-timers behanian-watchdog.timer --no-pager 2>/dev/null || echo "(timer non trouvé)"
              echo "État service watchdog :"
              systemctl is-active behanian-watchdog.timer 2>/dev/null || echo "INACTIF"

              echo ""
              echo "── Log watchdog (20 dernières lignes) ───"
              sudo tail -20 /var/log/behanian-watchdog.log 2>/dev/null || echo "(log vide ou absent — watchdog jamais déclenché)"

              echo "════════════════════════════════════════"
              echo "  FIN DIAGNOSTIC"
              echo "════════════════════════════════════════"
            DIAG
