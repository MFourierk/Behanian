name: Déployer Behanian

on:
  push:
    branches: [main]

jobs:
  deploy-vps:
    name: Déployer sur VPS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Déploiement VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /opt/behanian
            git fetch origin main
            git reset --hard origin/main
            chmod +x /opt/behanian/sync_complexe.sh
            source venv/bin/activate
            pip install -r requirements.txt --quiet
            python manage.py migrate --noinput
            python manage.py collectstatic --noinput
            python manage.py init_plats_simples
            python manage.py init_boissons_bar
            python manage.py init_plats_gibier
            sudo systemctl restart gunicorn
            mkdir -p ~/.ssh && chmod 700 ~/.ssh
            touch ~/.ssh/authorized_keys && chmod 600 ~/.ssh/authorized_keys
            grep -qF "AAAAC3NzaC1lZDI1NTE5AAAAICrq1NCIcbQUhoQ7ib3npl0mvNRrFt8A9+r9TsTelcd4" ~/.ssh/authorized_keys || echo "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAICrq1NCIcbQUhoQ7ib3npl0mvNRrFt8A9+r9TsTelcd4 behanian@behanian-server" >> ~/.ssh/authorized_keys
            echo "VPS mis a jour"

  deploy-local:
    name: Déployer sur serveur local
    runs-on: ubuntu-latest
    needs: deploy-vps
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Déploiement serveur local via WireGuard
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 5m
          script: |
            echo "=== Test WireGuard ===" && if ! ping -c 2 -W 5 10.8.0.2 > /dev/null 2>&1; then
              echo "WireGuard injoignable, tentative restart..."
              sudo systemctl restart wg-quick@wg0
              sleep 8
              ping -c 2 -W 5 10.8.0.2 || { echo "ERREUR: complexe injoignable via WireGuard apres restart"; exit 1; }
            fi
            echo "WireGuard OK"
            echo "=== Test SSH ===" && ssh -o StrictHostKeyChecking=no -o ConnectTimeout=15 -o BatchMode=yes behanian@10.8.0.2 "echo SSH_OK" || { echo "ERREUR: SSH vers complexe echoue"; exit 1; }

            SVC=$(printf '' | base64 -d)
            echo "$SVC" | ssh -o StrictHostKeyChecking=no behanian@10.8.0.2 "
              ssh-keyscan -H 89.167.66.194 >> ~/.ssh/known_hosts 2>/dev/null
              sort -u ~/.ssh/known_hosts -o ~/.ssh/known_hosts
              sudo tee /etc/systemd/system/ssh-reverse-tunnel.service > /dev/null
              sudo systemctl daemon-reload
              sudo systemctl enable ssh-reverse-tunnel
              sudo systemctl restart ssh-reverse-tunnel
              echo TUNNEL_OK
            "

            echo "=== Deploiement ===" &&
            rsync -az --delete \
              --exclude='.git/' \
              --exclude='venv/' \
              --exclude='__pycache__/' \
              --exclude='*.pyc' \
              --exclude='staticfiles/' \
              --exclude='media/' \
              --exclude='*.sqlite3' \
              --exclude='.env' \
              -e "ssh -o StrictHostKeyChecking=no" \
              /opt/behanian/ behanian@10.8.0.2:/opt/behanian/ &&
            ssh -o StrictHostKeyChecking=no -o ConnectTimeout=15 behanian@10.8.0.2 "
              set -e
              cd /opt/behanian &&
              source venv/bin/activate &&
              pip install -r requirements.txt --quiet &&
              python manage.py migrate --noinput &&
              python manage.py collectstatic --noinput &&
              python manage.py init_plats_simples &&
              python manage.py init_boissons_bar &&
              python manage.py init_plats_gibier &&
              sudo systemctl restart gunicorn &&
              echo COMPLEXE_OK
            " && echo "Serveur local mis a jour" || { echo "ERREUR: deploiement complexe echoue"; exit 1; }
