name: Déployer Behanian

on:
  push:
    branches: [main]

jobs:
  deploy-vps:
    name: Déployer sur VPS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Déploiement VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /opt/behanian
            git fetch origin main
            git reset --hard origin/main
            chmod +x /opt/behanian/sync_complexe.sh
            source venv/bin/activate
            pip install -r requirements.txt --quiet
            python manage.py migrate --noinput
            python manage.py collectstatic --noinput
            python manage.py init_plats_simples
            python manage.py init_boissons_bar
            python manage.py init_plats_gibier
            sudo systemctl restart gunicorn
            mkdir -p ~/.ssh && chmod 700 ~/.ssh
            touch ~/.ssh/authorized_keys && chmod 600 ~/.ssh/authorized_keys
            grep -qF "AAAAC3NzaC1lZDI1NTE5AAAAICrq1NCIcbQUhoQ7ib3npl0mvNRrFt8A9+r9TsTelcd4" ~/.ssh/authorized_keys || echo "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAICrq1NCIcbQUhoQ7ib3npl0mvNRrFt8A9+r9TsTelcd4 behanian@behanian-server" >> ~/.ssh/authorized_keys
            echo "VPS mis a jour"

  deploy-local:
    name: Déployer sur serveur local
    runs-on: ubuntu-latest
    needs: deploy-vps
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Test connectivité complexe
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 2m
          script: |
            if ! ping -c 2 -W 5 10.8.0.2 > /dev/null 2>&1; then
              echo "WireGuard injoignable, restart..."
              sudo systemctl restart wg-quick@wg0
              sleep 8
              ping -c 2 -W 5 10.8.0.2 || { echo "ERREUR: complexe injoignable"; exit 1; }
            fi
            echo "WireGuard OK"
            ssh -o StrictHostKeyChecking=no -o ConnectTimeout=15 -o BatchMode=yes behanian@10.8.0.2 "echo SSH_OK" || { echo "ERREUR: SSH echoue"; exit 1; }

      - name: Copier code vers complexe (tar+scp)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 8m
          script: |
            echo "=== Création archive code ==="
            tar -czf /tmp/behanian_code.tar.gz \
              --exclude='.git' \
              --exclude='venv' \
              --exclude='__pycache__' \
              --exclude='*.pyc' \
              --exclude='staticfiles' \
              --exclude='media' \
              --exclude='*.sqlite3' \
              --exclude='.env' \
              -C /opt/behanian .
            echo "Archive créée : $(du -sh /tmp/behanian_code.tar.gz | cut -f1)"
            echo "=== Envoi vers complexe ==="
            scp -o StrictHostKeyChecking=no /tmp/behanian_code.tar.gz behanian@10.8.0.2:/tmp/behanian_code.tar.gz
            echo "Envoi OK"
            rm -f /tmp/behanian_code.tar.gz

      - name: Appliquer code et migrations sur complexe
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 8m
          script: |
            ssh -o StrictHostKeyChecking=no -o ConnectTimeout=30 behanian@10.8.0.2 bash << 'REMOTE'
              set -e
              echo "=== Extraction archive ==="
              tar -xzf /tmp/behanian_code.tar.gz -C /opt/behanian/ --overwrite
              rm -f /tmp/behanian_code.tar.gz
              echo "Extraction OK"
              cd /opt/behanian
              source venv/bin/activate
              echo "=== Dépendances ==="
              pip install -r requirements.txt --quiet
              echo "=== Migrations ==="
              python manage.py migrate --noinput
              echo "=== Statiques ==="
              python manage.py collectstatic --noinput
              echo "=== Init catalogue boissons ==="
              python manage.py init_boissons_bar
              echo "=== Init catalogue plats ==="
              python manage.py init_plats_simples
              python manage.py init_plats_gibier
              echo "=== Redémarrage gunicorn ==="
              sudo systemctl restart gunicorn
              echo "COMPLEXE_OK"
            REMOTE
